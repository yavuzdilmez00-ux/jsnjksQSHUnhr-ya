name: Kütüphane JSON Botu (Ücretsiz)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 15 * *' 

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo-search

      - name: Python Botunu Çalıştır
        run: python content_bot.py

      - name: Değişiklikleri Depoya Yaz (Commit ve Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Yeni oluşan dosyayı ekle
          git add kulliyat.json
          
          # Eğer dosyada yeni bir veri varsa kaydet, yoksa hata vermeden geç
          git commit -m "otomasyon: Kütüphane içerikleri (JSON) güncellendi" || echo "Yeni eklenecek bir değişiklik yok."
          
          # Push hatasını önlemek için önce uzak depodaki değişiklikleri birleştir
          git pull --rebase origin main
          
          # Repoya yaz (Push)
          git push
