name: Kütüphane JSON Botu (G4F Free)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 15 * *' 

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle (G4F)
        run: |
          python -m pip install --upgrade pip
          # g4f ve bağlantı engellerini aşmak için gereken yan paketler
          pip install -U g4f curl_cffi nest_asyncio

      - name: Python Botunu Çalıştır
        run: python content_bot.py

      - name: Değişiklikleri Depoya Yaz
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add kulliyat.json
          
          git commit -m "otomasyon: Kütüphane içerikleri (G4F AI) güncellendi" || echo "Yeni eklenecek bir değişiklik yok."
          
          git pull --rebase origin main
          
          git push
