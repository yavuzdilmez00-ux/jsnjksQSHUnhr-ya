name: Kütüphane JSON Botu (Ücretsiz)

on:
  workflow_dispatch: # Actions sekmesinden istediğin zaman manuel çalıştırmak için
  schedule:
    - cron: '0 0 15 * *' # İsteğe bağlı: Her ayın 15'inde otomatik çalışır

# GitHub Actions botunun repoya dosya yazabilmesi için gerekli izin (Depoya Yazma İzni)
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Repoyu sanal makineye kopyalar
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      # 2. Python'u kurar
      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. KÜTÜPHANELERİ YÜKLE (İstediğin kısım)
      # Bedava yapay zeka için duckduckgo-search kütüphanesini indirir
      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo-search

      # 4. Python botunu çalıştırır (kulliyat.json dosyasını oluşturur)
      - name: Python Botunu Çalıştır
        run: python content_bot.py

      # 5. DEPOYA YAZMA (İstediğin kısım - Commit & Push)
      # Oluşan kulliyat.json dosyasını otomatik olarak GitHub repona yükler
      - name: Değişiklikleri Depoya Yaz (Commit ve Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Yeni oluşan dosyayı ekle
          git add kulliyat.json
          
          # Eğer dosyada yeni bir veri varsa kaydet, yoksa hata vermeden geç
          git commit -m "otomasyon: Kütüphane içerikleri (JSON) güncellendi" || echo "Yeni eklenecek bir değişiklik yok."
          
          # Repoya yaz (Push)
          git push
