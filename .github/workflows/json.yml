name: Sınırsız JSON Veri Botu

on:
  schedule:
    - cron: '0 0 * * *' # Her gece yarısı (UTC 00:00) otomatik çalışır
  workflow_dispatch: # Actions sekmesinden manuel tetikleme butonu

jobs:
  json-olustur-ve-kaydet:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Botun depoya JSON dosyasını yazabilmesi için zorunlu izin

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        # Mevcut kodumuz Python'un yerleşik kütüphanelerini (json, random, os) kullanıyor.
        # İleride dışarıdan kütüphane eklersen (örneğin requests) buraya ekleyebilirsin.
        run: |
          python -m pip install --upgrade pip
          # pip install requests # İhtiyaç olursa başındaki diyezi kaldır

      - name: Veri Üretici Python Kodunu Çalıştır
        # Python dosyasının adının 'veri_uretici.py' olduğundan emin ol
        run: python veri_uretici.py

      - name: Oluşan JSON Dosyasını Github'a Pushla
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "🚀 Veri Tabanı Botu: Android için JSON verileri güncellendi" || exit 0
          
          # Çakışmaları önlemek için önce yenilikleri çekiyoruz
          git pull --rebase origin main
          
          # Yeni JSON dosyasını depoya gönderiyoruz
          git push
