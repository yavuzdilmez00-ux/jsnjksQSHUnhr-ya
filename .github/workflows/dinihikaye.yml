name: Dini Hikaye Avcısı (Oto-Çekim)

on:
  schedule:
    - cron: '0 5,17 * * *' # Günde iki kez çalışır
  workflow_dispatch:

jobs:
  veri-cek-ve-kaydet:
    runs-on: ubuntu-latest
    
    # Depoya commit atabilmesi için zorunlu yazma izni
    permissions:
      contents: write 
      
    timeout-minutes: 30

    steps:
    - name: 📥 Depoyu Klonla
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Tüm geçmişi çekmek, rebase işlemlerinde çakışmaları önler

    - name: 🐍 Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 duckduckgo-search

    - name: 🚀 Hikaye Avcısını Çalıştır
      run: python hikaye_avcisi.py

    - name: 📤 Verileri Depoya Gönder (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🌍 Otomatik Tarama: Yeni hikayeler çekildi ve eklendi" || echo "Yeni veri bulunamadı."
        git pull --rebase origin main
        git push
