name: 10 Adetlik Test Botu

on:
  workflow_dispatch: # Sadece sen butona bastığında çalışır (Test için ideal)

jobs:
  test-verisi-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Python Test Kodunu Çalıştır
        run: python test_uretici.py

      - name: JSON Dosyasını Github'a Yükle
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "🧪 Test: 10 adetlik örnek JSON verisi oluşturuldu" || exit 0
          git pull --rebase origin main
          git push
