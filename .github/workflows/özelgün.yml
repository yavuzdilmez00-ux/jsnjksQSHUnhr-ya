name: Ozel Gun Mesaj Botu

on:
  schedule:
    # Her Pazar gecesi saat 03:00'te çalışır (Haftada sadece 1 kez)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Depo arayüzünden tek tıkla manuel çalıştırma butonu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Mega Mesaj Paketini Üret (Toplam 280.000 Mesaj)
        run: python bot.py

      - name: Depoya Commit Et ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veriler/
          git commit -m "bot: devasa paket, her kategori icin yepyeni 20.000 mesaj eklendi 🚀" || echo "Yeni degisiklik yok."
          git pull --rebase origin main
          git push
