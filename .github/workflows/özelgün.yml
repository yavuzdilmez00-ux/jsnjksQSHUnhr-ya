name: Ozel Gun Mesaj Botu

on:
  schedule:
    # Her gün Sabah 09:00 ve Akşam 21:00'de günde 2 kere çalışır.
    - cron: '0 9,21 * * *'
  workflow_dispatch: # İstediğin zaman manuel çalıştırma butonu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Mesajları Üret (Her dosya için 1000 adet)
        run: python bot.py

      - name: Depoya Commit Et ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veriler/
          git commit -m "bot: her bolum icin 1000 yeni tebrik mesaji eklendi 🚀" || echo "Yeni degisiklik yok."
          git pull --rebase origin main
          git push
