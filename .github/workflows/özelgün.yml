name: Ozel Gun Mesaj Botu

on:
  schedule:
    # Her gün, sabah 08:00'den öğleden sonra 13:00'e kadar HER SAAT BAŞI çalışır.
    # Bu, senin "5 saat boyunca üretmeye devam etsin ve her gün yapsın" isteğinin tam karşılığıdır.
    # (Not: GitHub sunucuları UTC kullandığı için Türkiye saati ile ayarlamalarda gecikme olabilir, ancak her gün o 5 saatlik dilimde kesinlikle çalışır)
    - cron: '0 8,9,10,11,12 * * *'
  workflow_dispatch: # İstediğin zaman manuel de başlatabilirsin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Depoya otomatik JSON yüklemek için gerekli

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Mesajları Üret (bot.py - Her dosyaya 200'er adet)
        run: python bot.py

      - name: Depoya Commit Et ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veriler/
          git commit -m "bot: her bolum icin 200 yeni ve benzersiz mesaj eklendi 🚀" || echo "Yeni degisiklik yok."
          git pull --rebase origin main
          git push
